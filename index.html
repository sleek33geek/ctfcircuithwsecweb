<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RTL Signal GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-width: 100%;
      min-height: 100%;

      color: #fff;
      font-family: monospace;

      overflow: auto;

      background: #111;
    }

    .gui-map {
      position: relative;

      width: 1048px;
      height: 806px;

      margin: 0 auto;

      background-image: url("images/webpage_up.png");
      background-repeat: no-repeat;
      background-position: top left;
      background-size: 1048px 806px;
    }


    /* ============================================================
       LINKS ON THE ORIGINAL GUI
       ============================================================ */

    .link-encrypt {
      position: absolute;
      left: 22px;
      top: 44px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    .link-schematic {
      position: absolute;
      left: 22px;
      top: 126px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    /* Multimeter button link positioning */
    .link-multimeter {
      position: absolute;
      left: 22px;
      top: 210px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* ============================================================
       16-DIGIT DIGITAL INPUT BOX (Top green display area next to key)
       ============================================================ */
    .digital-input-wrapper {
      position: absolute;
      left: 418px;
      top: 24px;
      width: 264px;
      height: 38px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .digital-input-field {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
      transform: scaleY(1.35);
      line-height: 38px;
    }

    .digital-input-field::placeholder {
      color: rgba(0, 255, 204, 0.25);
      letter-spacing: 2px;
    }


    /* ============================================================
       PROBE BUTTON OVERLAYS (Probes A through E)
       ============================================================ */
    .link-probe {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* Column 1 Probes (Left side of scopes) */
    #probeBtnA {
      left: 366px;
      top: 526px;
    }

    #probeBtnB {
      left: 366px;
      top: 604px;
    }

    /* Column 2 Probes (Right side of scopes) */
    #probeBtnC {
      left: 696px;
      top: 526px;
    }

    #probeBtnD {
      left: 696px;
      top: 604px;
    }

    #probeBtnE {
      left: 696px;
      top: 682px;
    }


    /* ============================================================
       CUSTOM CURSOR STATES (Hotspot 2 2 for 40x55 image dimensions)
       ============================================================ */

    body.custom-cursor, 
    body.custom-cursor * {
      cursor: url('images/EMmeasure.png') 4 4, auto !important;
    }

    body.cursor-probe-a, body.cursor-probe-a * { cursor: url('images/EM_measure_A.png') 2 2, auto !important; }
    body.cursor-probe-b, body.cursor-probe-b * { cursor: url('images/EM_measure_B.png') 2 2, auto !important; }
    body.cursor-probe-c, body.cursor-probe-c * { cursor: url('images/EM_measure_C.png') 2 2, auto !important; }
    body.cursor-probe-d, body.cursor-probe-d * { cursor: url('images/EM_measure_D.png') 2 2, auto !important; }
    body.cursor-probe-e, body.cursor-probe-e * { cursor: url('images/EM_measure_E.png') 2 2, auto !important; }


    /* ============================================================
       SIX MOVING OSCILLOSCOPE PLOTS
       ============================================================ */

    .scope-panel {
      position: absolute;

      width: 264px;
      height: 72px;

      background: rgba(5, 7, 10, 0.80);

      border: 1px solid rgba(0, 255, 136, 0.42);
      border-radius: 2px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      z-index: 10;
    }

    /* Left Column Plots */
    #scope1 {
      left: 406px;
      top: 526px;
    }

    #scope3 {
      left: 406px;
      top: 604px;
    }

    #scope5 {
      left: 406px;
      top: 682px;
    }

    /* Right Column Plots */
    #scope2 {
      left: 736px;
      top: 526px;
    }

    #scope4 {
      left: 736px;
      top: 604px;
    }

    #scope6 {
      left: 736px;
      top: 682px;
    }
    
    .scope-header {
      height: 18px;
      min-height: 18px;

      padding: 1px 5px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #00ff88;
      font-size: 9px;
      line-height: 1;

      background: rgba(0, 255, 136, 0.07);
      border-bottom: 1px solid rgba(0, 255, 136, 0.20);
    }

    .scope-header span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scope-canvas {
      width: 100%;
      height: calc(100% - 18px);
      display: block;
    }


    /* ============================================================
       SUPERPOSITION MIXER
       ============================================================ */

    .calc-panel {
      position: absolute;

      left: 20px;
      top: 672px;

      width: 350px;
      height: 92px;

      z-index: 11;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 4px 7px;

      background: rgba(9, 13, 22, 0.78);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 2px;

      color: #00ff88;
      font-size: 9px;
    }

    .calc-title {
      margin-bottom: 2px;
      font-weight: bold;
    }

    .mix-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 2px;
    }

    .mix-controls {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mix-controls label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
    }

    .mix-controls input {
      margin: 0;
      accent-color: #00ff88;
    }


    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="gui-map">

    <!-- LINKS -->
    <a
      class="link-encrypt"
      href="encrypt.html"
      aria-label="View Verilog / RTL code"
      title="View Verilog / RTL code">
    </a>

    <a
      class="link-schematic"
      href="schematic_block_diagram.html"
      aria-label="View schematic block diagram"
      title="View schematic block diagram">
    </a>

    <!-- Multimeter button -> activates general custom cursor -->
    <a
      class="link-multimeter"
      id="multimeterBtn"
      aria-label="Activate multimeter probe cursor"
      title="Activate multimeter probe cursor">
    </a>

    <!-- 16-DIGIT DIGITAL INPUT FIELD NEXT TO KEY -->
    <div class="digital-input-wrapper">
      <input 
        type="text" 
        id="digitalInputKey" 
        class="digital-input-field" 
        maxlength="16" 
        placeholder="0000000000000000" 
        autocomplete="off" 
        spellcheck="false"
      />
    </div>

    <!-- PROBE BUTTON OVERLAYS (Clicking switches to Probe A-E cursor) -->
    <a class="link-probe" id="probeBtnA" aria-label="Probe A" title="Activate Probe A cursor"></a>
    <a class="link-probe" id="probeBtnB" aria-label="Probe B" title="Activate Probe B cursor"></a>
    <a class="link-probe" id="probeBtnC" aria-label="Probe C" title="Activate Probe C cursor"></a>
    <a class="link-probe" id="probeBtnD" aria-label="Probe D" title="Activate Probe D cursor"></a>
    <a class="link-probe" id="probeBtnE" aria-label="Probe E" title="Activate Probe E cursor"></a>


    <!-- SIX ANIMATED PLOTS -->

    <!-- Plot 1 -->
    <section class="scope-panel" id="scope1">
      <div class="scope-header">
        <span>CH 1: Sine Wave</span>
        <span>1 kHz</span>
      </div>
      <canvas class="scope-canvas" id="canvas1"></canvas>
    </section>
