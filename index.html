<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RTL Signal GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-width: 100%;
      min-height: 100%;

      color: #fff;
      font-family: monospace;

      overflow: auto;

      background: #111;
    }

    .gui-map {
      position: relative;

      width: 1048px;
      height: 806px;

      margin: 0 auto;

      background-image: url("images/webpage_up.png");
      background-repeat: no-repeat;
      background-position: top left;
      background-size: 1048px 806px;
    }


    /* ============================================================
       LINKS ON THE ORIGINAL GUI
       ============================================================ */

    .link-encrypt {
      position: absolute;
      left: 22px;
      top: 44px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    .link-schematic {
      position: absolute;
      left: 22px;
      top: 126px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    /* Multimeter button link positioning */
    .link-multimeter {
      position: absolute;
      left: 22px;
      top: 210px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* ============================================================
       16-DIGIT DIGITAL INPUT BOX (Top area next to the key)
       ============================================================ */
    .digital-input-wrapper {
      position: absolute;
      left: 412px;
      top: 24px;
      width: 264px;
      height: 38px;
      z-index: 30;
      display: flex;
      align-items: center;
    }
    
    .digital-input-field {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #00ffcc;
      font-family: monospace;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 2px;
      transform: scaleY(1.35);
      line-height: 38px;
      text-align: center;
      text-shadow: 0 0 6px rgba(0, 255, 204, 0.7);
    }

.digital-input-field::placeholder {
      color: rgba(0, 255, 204, 0.25);
      letter-spacing: 2px; /* Matched to input field */
    }


    /* ============================================================
       PROBE BUTTON OVERLAYS (Probes A through E)
       ============================================================ */
    .link-probe {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* Column 1 Probes (Left side of scopes) */
    #probeBtnA {
      left: 366px;
      top: 526px;
    }

    #probeBtnB {
      left: 366px;
      top: 604px;
    }

    /* Column 2 Probes (Right side of scopes) */
    #probeBtnC {
      left: 696px;
      top: 526px;
    }

    #probeBtnD {
      left: 696px;
      top: 604px;
    }

    #probeBtnE {
      left: 696px;
      top: 682px;
    }


    /* ============================================================
       CUSTOM CURSOR STATES (Hotspot 2 2 for 40x55 image dimensions)
       ============================================================ */

    body.custom-cursor, 
    body.custom-cursor * {
      cursor: url('images/EMmeasure.png') 4 4, auto !important;
    }

    body.cursor-probe-a, body.cursor-probe-a * { cursor: url('images/EM_measure_A.png') 2 2, auto !important; }
    body.cursor-probe-b, body.cursor-probe-b * { cursor: url('images/EM_measure_B.png') 2 2, auto !important; }
    body.cursor-probe-c, body.cursor-probe-c * { cursor: url('images/EM_measure_C.png') 2 2, auto !important; }
    body.cursor-probe-d, body.cursor-probe-d * { cursor: url('images/EM_measure_D.png') 2 2, auto !important; }
    body.cursor-probe-e, body.cursor-probe-e * { cursor: url('images/EM_measure_E.png') 2 2, auto !important; }


    /* ============================================================
       SIX MOVING OSCILLOSCOPE PLOTS
       ============================================================ */

    .scope-panel {
      position: absolute;

      width: 264px;
      height: 72px;

      background: rgba(5, 7, 10, 0.80);

      border: 1px solid rgba(0, 255, 136, 0.42);
      border-radius: 2px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      z-index: 10;
    }

    /* Left Column Plots */
    #scope1 {
      left: 406px;
      top: 526px;
    }

    #scope3 {
      left: 406px;
      top: 604px;
    }

    #scope5 {
      left: 406px;
      top: 682px;
    }

    /* Right Column Plots */
    #scope2 {
      left: 736px;
      top: 526px;
    }

    #scope4 {
      left: 736px;
      top: 604px;
    }

    #scope6 {
      left: 736px;
      top: 682px;
    }
    
    .scope-header {
      height: 18px;
      min-height: 18px;

      padding: 1px 5px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #00ff88;
      font-size: 9px;
      line-height: 1;

      background: rgba(0, 255, 136, 0.07);
      border-bottom: 1px solid rgba(0, 255, 136, 0.20);
    }

    .scope-header span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scope-canvas {
      width: 100%;
      height: calc(100% - 18px);
      display: block;
    }


    /* ============================================================
       SUPERPOSITION MIXER
       ============================================================ */

    .calc-panel {
      position: absolute;

      left: 20px;
      top: 672px;

      width: 350px;
      height: 92px;

      z-index: 11;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 4px 7px;

      background: rgba(9, 13, 22, 0.78);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 2px;

      color: #00ff88;
      font-size: 9px;
    }

    .calc-title {
      margin-bottom: 2px;
      font-weight: bold;
    }

    .mix-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 2px;
    }

    .mix-controls {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mix-controls label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
    }

    .mix-controls input {
      margin: 0;
      accent-color: #00ff88;
    }


    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="gui-map">

    <!-- LINKS -->
    <a
      class="link-encrypt"
      href="encrypt.html"
      aria-label="View Verilog / RTL code"
      title="View Verilog / RTL code">
    </a>

    <a
      class="link-schematic"
      href="schematic_block_diagram.html"
      aria-label="View schematic block diagram"
      title="View schematic block diagram">
    </a>

    <!-- Multimeter button -> activates general custom cursor -->
    <a
      class="link-multimeter"
      id="multimeterBtn"
      aria-label="Activate multimeter probe cursor"
      title="Activate multimeter probe cursor">
    </a>

    <!-- 16-DIGIT DIGITAL INPUT FIELD NEXT TO KEY -->
    <div class="digital-input-wrapper">
      <input 
        type="text" 
        id="digitalInputKey" 
        class="digital-input-field" 
        maxlength="16" 
        placeholder="0000000000000000" 
        autocomplete="off" 
        spellcheck="false"
      />
    </div>

    <!-- PROBE BUTTON OVERLAYS (Clicking switches to Probe A-E cursor) -->
    <a class="link-probe" id="probeBtnA" aria-label="Probe A" title="Activate Probe A cursor"></a>
    <a class="link-probe" id="probeBtnB" aria-label="Probe B" title="Activate Probe B cursor"></a>
    <a class="link-probe" id="probeBtnC" aria-label="Probe C" title="Activate Probe C cursor"></a>
    <a class="link-probe" id="probeBtnD" aria-label="Probe D" title="Activate Probe D cursor"></a>
    <a class="link-probe" id="probeBtnE" aria-label="Probe E" title="Activate Probe E cursor"></a>


    <!-- SIX ANIMATED PLOTS -->

    <!-- Plot 1 -->
    <section class="scope-panel" id="scope1">
      <div class="scope-header">
        <span>CH 1: Sine Wave</span>
        <span>1 kHz</span>
      </div>
      <canvas class="scope-canvas" id="canvas1"></canvas>
    </section>

    <!-- Plot 2 -->
    <section class="scope-panel" id="scope2">
      <div class="scope-header">
        <span>CH 2: Square Wave</span>
        <span>500 Hz</span>
      </div>
      <canvas class="scope-canvas" id="canvas2"></canvas>
    </section>

    <!-- Plot 3 -->
    <section class="scope-panel" id="scope3">
      <div class="scope-header">
        <span>CH 3: Triangle Wave</span>
        <span>250 Hz</span>
      </div>
      <canvas class="scope-canvas" id="canvas3"></canvas>
    </section>

    <!-- Plot 4 -->
    <section class="scope-panel" id="scope4">
      <div class="scope-header">
        <span>CH 4: High-Freq Noise/Sine</span>
        <span>2 kHz</span>
      </div>
      <canvas class="scope-canvas" id="canvas4"></canvas>
    </section>

    <!-- Plot 5 (Calculated Plot at Bottom Left of Column Grid) -->
    <section class="scope-panel" id="scope5">
      <div class="scope-header">
        <span>CH 5: Superposition Output</span>
        <span>MATH</span>
      </div>
      <canvas class="scope-canvas" id="canvas5"></canvas>
    </section>

    <!-- Plot 6 (Additional Moving Plot at Bottom Right of Column Grid) -->
    <section class="scope-panel" id="scope6">
      <div class="scope-header">
        <span>CH 6: Modulation Signal</span>
        <span>100 Hz</span>
      </div>
      <canvas class="scope-canvas" id="canvas6"></canvas>
    </section>


    <!-- MIXER (Positioned under the image at bottom left) -->
    <section class="calc-panel">
      <div class="calc-title">Superposition Mixer</div>

      <!-- Channel 1 & 2 Controls -->
      <div class="mix-row">
        <div class="mix-controls">
          <label><input type="checkbox" id="mix1" checked> CH1</label>
          <select id="op1" style="background:#111; color:#00ff88; border:1px solid #00ff88; font-size:9px;">
            <option value="add">+</option>
            <option value="sub">-</option>
          </select>
        </div>

        <div class="mix-controls">
          <label><input type="checkbox" id="mix2" checked> CH2</label>
          <select id="op2" style="background:#111; color:#00ff88; border:1px solid #00ff88; font-size:9px;">
            <option value="add">+</option>
            <option value="sub">-</option>
          </select>
        </div>
      </div>

      <!-- Channel 3 & 4 Controls -->
      <div class="mix-row">
        <div class="mix-controls">
          <label><input type="checkbox" id="mix3"> CH3</label>
          <select id="op3" style="background:#111; color:#00ff88; border:1px solid #00ff88; font-size:9px;">
            <option value="add">+</option>
            <option value="sub">-</option>
          </select>
        </div>

        <div class="mix-controls">
          <label><input type="checkbox" id="mix4"> CH4</label>
          <select id="op4" style="background:#111; color:#00ff88; border:1px solid #00ff88; font-size:9px;">
            <option value="add">+</option>
            <option value="sub">-</option>
          </select>
        </div>
      </div>

      <!-- Channel 5 Control -->
      <div class="mix-row">
        <div class="mix-controls">
          <label><input type="checkbox" id="mix5"> CH5</label>
          <select id="op5" style="background:#111; color:#00ff88; border:1px solid #00ff88; font-size:9px;">
            <option value="add">+</option>
            <option value="sub">-</option>
          </select>
        </div>
      </div>
    </section>


    <div id="loading" class="hidden"></div>
    <div id="wave-grid" class="hidden"></div>

  </main>


  <!-- DELAYED GUI SCRIPTS -->
  <script>
    setTimeout(() => {
      document.getElementById("loading").classList.remove("hidden");
    }, 120000);
  </script>

  <script>
    let timerStarted = false;

    document.addEventListener("click", () => {
      if (timerStarted) return;

      timerStarted = true;

      setTimeout(() => {
        document.getElementById("wave-grid").classList.remove("hidden");
      }, 120000);
    });
  </script>


  <!-- OSCILLOSCOPE ANIMATION -->
  <script>
    const canvasElements = [
      document.getElementById("canvas1"),
      document.getElementById("canvas2"),
      document.getElementById("canvas3"),
      document.getElementById("canvas4"),
      document.getElementById("canvas5"),
      document.getElementById("canvas6")
    ];

    const ctxs = canvasElements.map(canvas => canvas.getContext("2d"));

    let time = 0;


    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));

      const targetWidth = Math.round(width * dpr);
      const targetHeight = Math.round(height * dpr);

      if (
        canvas.width !== targetWidth ||
        canvas.height !== targetHeight
      ) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      const ctx = canvas.getContext("2d");

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      return { width, height };
    }


    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = "#17212d";
      ctx.lineWidth = 1;

      const stepX = width / 8;
      const stepY = height / 4;

      ctx.beginPath();

      for (let x = 0; x <= width; x += stepX) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
      }

      for (let y = 0; y <= height; y += stepY) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
      }

      ctx.stroke();
    }


    function animate() {
      time += 0.04;

      ctxs.forEach((ctx, index) => {

        const canvas = ctx.canvas;

        const {
          width,
          height
        } = resizeCanvas(canvas);

        const centerY = height / 2;

        ctx.fillStyle = "rgba(5, 7, 10, 0.40)";
        ctx.fillRect(0, 0, width, height);

        drawGrid(ctx, width, height);

        ctx.lineWidth = 1.6;
        ctx.beginPath();

        for (let x = 0; x < width; x++) {

          const t =
            (x / width) * 4 * Math.PI +
            time;

          /* Base signals */
          const s1 = Math.sin(t) * (height * 0.30);
          const s2 = (Math.sin(t * 2) > 0 ? 1 : -1) * (height * 0.25);
          const s3 = (Math.asin(Math.sin(t)) * (2 / Math.PI)) * (height * 0.30);
          const s4 = Math.sin(t * 4 + Math.cos(t)) * (height * 0.22);
          const s6 = Math.sin(t * 0.5) * Math.cos(t * 3) * (height * 0.28);

          let yVal;

          if (index === 0) {
            yVal = s1;
            ctx.strokeStyle = "#00ffcc";
          }
          else if (index === 1) {
            yVal = s2;
            ctx.strokeStyle = "#ff3366";
          }
          else if (index === 2) {
            yVal = s3;
            ctx.strokeStyle = "#00ffaa";
          }
          else if (index === 3) {
            yVal = s4;
            ctx.strokeStyle = "#33ccff";
          }
          else if (index === 4) {
            /* Plot 5 = calculated superposition output with CH1-CH5 handling */
            yVal = 0;

            if (document.getElementById("mix1").checked) {
              let op = document.getElementById("op1").value;
              yVal += (op === 'sub' ? -1 : 1) * (s1 * 0.5);
            }
            if (document.getElementById("mix2").checked) {
              let op = document.getElementById("op2").value;
              yVal += (op === 'sub' ? -1 : 1) * (s2 * 0.5);
            }
            if (document.getElementById("mix3").checked) {
              let op = document.getElementById("op3").value;
              yVal += (op === 'sub' ? -1 : 1) * (s3 * 0.5);
            }
            if (document.getElementById("mix4").checked) {
              let op = document.getElementById("op4").value;
              yVal += (op === 'sub' ? -1 : 1) * (s4 * 0.5);
            }
            if (document.getElementById("mix5").checked) {
              let op = document.getElementById("op5").value;
              let ch5SubVal = 0;
              if (document.getElementById("mix1").checked) ch5SubVal += (document.getElementById("op1").value === 'sub' ? -1 : 1) * (s1 * 0.5);
              if (document.getElementById("mix2").checked) ch5SubVal += (document.getElementById("op2").value === 'sub' ? -1 : 1) * (s2 * 0.5);
              if (document.getElementById("mix3").checked) ch5SubVal += (document.getElementById("op3").value === 'sub' ? -1 : 1) * (s3 * 0.5);
              if (document.getElementById("mix4").checked) ch5SubVal += (document.getElementById("op4").value === 'sub' ? -1 : 1) * (s4 * 0.5);
              yVal += (op === 'sub' ? -1 : 1) * ch5SubVal;
            }

            ctx.strokeStyle = "#ffcc00";
          }
          else if (index === 5) {
            /* Plot 6 = additional moving plot */
            yVal = s6;
            ctx.strokeStyle = "#ff66cc";
          }

          const drawY = centerY - yVal;

          if (x === 0) {
            ctx.moveTo(x, drawY);
          } else {
            ctx.lineTo(x, drawY);
          }
        }

        ctx.stroke();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>

  <!-- PROBE & MULTIMETER CURSOR SWITCHING SCRIPT -->
  <script>
    function setProbeCursor(cursorClassName) {
      const bodyClasses = document.body.classList;
      const probeClasses = ['cursor-probe-a', 'cursor-probe-b', 'cursor-probe-c', 'cursor-probe-d', 'cursor-probe-e', 'custom-cursor'];
      
      const isActive = bodyClasses.contains(cursorClassName);

      // Remove all active probe/custom cursor classes
      probeClasses.forEach(cls => bodyClasses.remove(cls));

      // Toggle off if clicked again, or activate if new
      if (!isActive) {
        bodyClasses.add(cursorClassName);
      }
    }

    const probes = [
      { id: 'probeBtnA', cls: 'cursor-probe-a' },
      { id: 'probeBtnB', cls: 'cursor-probe-b' },
      { id: 'probeBtnC', cls: 'cursor-probe-c' },
      { id: 'probeBtnD', cls: 'cursor-probe-d' },
      { id: 'probeBtnE', cls: 'cursor-probe-e' }
    ];

    probes.forEach(probe => {
      const btn = document.getElementById(probe.id);
      if (btn) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          setProbeCursor(probe.cls);
        });
      }
    });

    const multimeterBtn = document.getElementById("multimeterBtn");
    if (multimeterBtn) {
      multimeterBtn.addEventListener("click", (e) => {
        e.preventDefault();
        setProbeCursor('custom-cursor');
      });
    }

    // STRICT 16-DIGIT BINARY INPUT VALIDATION (0 and 1 only)
    const digitalInput = document.getElementById('digitalInputKey');
    if (digitalInput) {
      digitalInput.addEventListener('input', (e) => {
        let val = digitalInput.value.replace(/[^01]/g, '');
        if (val.length > 16) {
          val = val.slice(0, 16);
        }
        digitalInput.value = val;
      });
    }
  </script>

</body>
</html>
