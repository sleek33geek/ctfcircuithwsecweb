<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>My test page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- Container holding your updated background image and wave grid together -->
    <div class="page-container">
      <img src="images/webpage_updated.png" alt="Webpage Background" class="bg-image">

      <!-- Wave grid locked inside the container -->
      <div id="wave-grid" class="hidden">
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      </div>
    </div>

    <!-- Your JavaScript timer that waits 2 minutes after a click -->
    <script>
      let timerStarted = false;
    
      document.addEventListener("click", () => {
        if (timerStarted) return;
      
        timerStarted = true;
      
        setTimeout(() => {
          document.getElementById("wave-grid").classList.remove("hidden");
        }, 120000); // 2 minutes
      });
    </script>
        
  </body>
</html>
