<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RTL Signal GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-width: 100%;
      min-height: 100%;

      color: #fff;
      font-family: monospace;

      overflow: auto;

      background: #111;
    }

    .gui-map {
      position: relative;

      width: 1048px;
      height: 806px;

      margin: 0 auto;

      background-image: url("images/webpage_up.png");
      background-repeat: no-repeat;
      background-position: top left;
      background-size: 1048px 806px;
    }


    /* ============================================================
       LINKS ON THE ORIGINAL GUI
       ============================================================ */

    .link-encrypt {
      position: absolute;
      left: 22px;
      top: 44px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    .link-schematic {
      position: absolute;
      left: 22px;
      top: 126px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
    }

    /* Multimeter button link positioning */
    .link-multimeter {
      position: absolute;
      left: 22px;
      top: 210px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* Matrix Calculator button link positioning */
    .link-matrix {
      position: absolute;
      left: 22px;
      top: 350px;
      width: 68px;
      height: 54px;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    /* ============================================================
       16-DIGIT DIGITAL INPUT BOX (Top area next to the key)
       ============================================================ */
    .digital-input-wrapper {
      position: absolute;
      left: 418px;
      top: 24px;
      width: 264px;
      height: 38px;
      z-index: 30;
      display: flex;
      align-items: center;
    }

    .digital-input-field {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #00ffcc;
      font-family: monospace;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 2px;
      transform: scaleY(1.35);
      line-height: 38px;
      text-align: center;
      text-shadow: 0 0 6px rgba(0, 255, 204, 0.7);
    }

    .digital-input-field::placeholder {
      color: rgba(0, 255, 204, 0.25);
      letter-spacing: 2px;
    }


    /* ============================================================
       PROBE BUTTON OVERLAYS (Probes A through E)
       ============================================================ */
    .link-probe {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      z-index: 30;
      display: block;
      cursor: pointer;
    }

    #probeBtnA { left: 366px; top: 526px; }
    #probeBtnB { left: 366px; top: 604px; }
    #probeBtnC { left: 696px; top: 526px; }
    #probeBtnD { left: 696px; top: 604px; }
    #probeBtnE { left: 696px; top: 682px; }


    /* ============================================================
       CUSTOM CURSOR STATES
       ============================================================ */
    body.custom-cursor, 
    body.custom-cursor * {
      cursor: url('images/EMmeasure.png') 4 4, auto !important;
    }

    body.cursor-probe-a, body.cursor-probe-a * { cursor: url('images/EM_measure_A.png') 2 2, auto !important; }
    body.cursor-probe-b, body.cursor-probe-b * { cursor: url('images/EM_measure_B.png') 2 2, auto !important; }
    body.cursor-probe-c, body.cursor-probe-c * { cursor: url('images/EM_measure_C.png') 2 2, auto !important; }
    body.cursor-probe-d, body.cursor-probe-d * { cursor: url('images/EM_measure_D.png') 2 2, auto !important; }
    body.cursor-probe-e, body.cursor-probe-e * { cursor: url('images/EM_measure_E.png') 2 2, auto !important; }


    /* ============================================================
       SIX MOVING OSCILLOSCOPE PLOTS & DIGIT OVERLAY
       ============================================================ */
    .scope-panel {
      position: absolute;
      width: 264px;
      height: 72px;
      background: rgba(5, 7, 10, 0.80);
      border: 1px solid rgba(0, 255, 136, 0.42);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    #scope1 { left: 406px; top: 526px; }
    #scope3 { left: 406px; top: 604px; }
    #scope5 { left: 406px; top: 682px; }
    #scope2 { left: 736px; top: 526px; }
    #scope4 { left: 736px; top: 604px; }
    #scope6 { left: 736px; top: 682px; }
    
    .scope-header {
      height: 18px;
      min-height: 18px;
      padding: 1px 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #00ff88;
      font-size: 9px;
      line-height: 1;
      background: rgba(0, 255, 136, 0.07);
      border-bottom: 1px solid rgba(0, 255, 136, 0.20);
    }

    .scope-header span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scope-canvas-container {
      position: relative;
      width: 100%;
      height: calc(100% - 18px);
    }

    .scope-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .plot-region-badge {
      position: absolute;
      right: 8px;
      bottom: 2px;
      font-size: 42px;
      font-weight: 900;
      color: #b15eff;
      text-shadow: 0 0 10px #b15eff, 0 0 20px #000;
      pointer-events: none;
      z-index: 15;
      display: none;
    }


    /* ============================================================
       CORRECTED DOWNWARD-SHIFTED 9 REGION OVERLAYS
       ============================================================ */
    .purple-region {
      position: absolute;
      z-index: 28;
      cursor: pointer;
    }

    /* Bottom Row (Regions 1 - 4): Shifted down to start at pink line (top: 275px) */
    #region1 { left: 152px; top: 275px; width: 202px; height: 140px; }
    #region2 { left: 360px; top: 275px; width: 202px; height: 140px; }
    #region3 { left: 568px; top: 275px; width: 202px; height: 140px; }
    #region4 { left: 776px; top: 275px; width: 202px; height: 140px; }

    /* Top Row (Regions 5 - 8): Shifted down between yellow and green lines */
    #region5 { left: 152px; top: 130px; width: 202px; height: 145px; }
    #region6 { left: 360px; top: 130px; width: 202px; height: 145px; }
    #region7 { left: 568px; top: 130px; width: 202px; height: 145px; }
    #region8 { left: 776px; top: 130px; width: 202px; height: 145px; }

    /* Top Header Area (Region 9): Positioned right above the green line */
    #region9 { left: 152px; top: 45px; width: 826px; height: 85px; }


    /* ============================================================
       SUPERPOSITION MIXER
       ============================================================ */
    .calc-panel {
      position: absolute;
      left: 20px;
      top: 672px;
      width: 350px;
      height: 92px;
      z-index: 11;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 7px;
      background: rgba(9, 13, 22, 0.78);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 2px;
      color: #00ff88;
      font-size: 9px;
    }

    .calc-title {
      margin-bottom: 2px;
      font-weight: bold;
    }

    .mix-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 2px;
    }

    .mix-controls {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mix-controls label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
    }

    .mix-controls input {
      margin: 0;
      accent-color: #00ff88;
    }


    /* ============================================================
       EM LEAKAGE SIGNALS (CHIP AREA)
       ============================================================ */
    .em-signal-spot {
      position: absolute;
      width: 40px;
      height: 35px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    body.em-leakage-active .em-signal-spot {
      animation: emLeakageCycle 3s infinite ease-in-out;
    }

    .em-signal-spot:nth-child(2) { animation-delay: 0.4s; }
    .em-signal-spot:nth-child(3) { animation-delay: 0.8s; }
    .em-signal-spot:nth-child(4) { animation-delay: 1.2s; }
    .em-signal-spot:nth-child(5) { animation-delay: 0.3s; }
    .em-signal-spot:nth-child(6) { animation-delay: 0.9s; }
    .em-signal-spot:nth-child(7) { animation-delay: 1.5s; }
    .em-signal-spot:nth-child(8) { animation-delay: 0.6s; }

    .em-arc {
      position: absolute;
      border: 2px solid #ff3366;
      border-top: 2px solid #ff3366;
      border-bottom: none;
      border-left: none;
      border-right: none;
      border-radius: 50% 50% 0 0;
      opacity: 0;
    }

    .em-arc-1 { width: 12px; height: 6px; bottom: 2px; animation: arcFadeSequence 3s infinite; }
    .em-arc-2 { width: 24px; height: 12px; bottom: 7px; animation: arcFadeSequence 3s infinite; animation-delay: 0.25s; }
    .em-arc-3 { width: 36px; height: 18px; bottom: 12px; animation: arcFadeSequence 3s infinite; animation-delay: 0.5s; }

    @keyframes arcFadeSequence {
      0% { opacity: 0; transform: scale(0.8); }
      20% { opacity: 1; transform: scale(1); }
      60% { opacity: 1; transform: scale(1); }
      80% { opacity: 0; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(0.8); }
    }

    @keyframes emLeakageCycle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .hidden {
      display: none;
    }

  <!-- MULTIMETER & PROBE MEASUREMENT SELECTION SCRIPT -->
  <script>
    let isMultimeterActive = false;
    let selectedProbe = null; // 'A', 'B', 'C', 'D', 'E'

    const multimeterBtn = document.getElementById("multimeterBtn");
    const probeBtns = {
      'A': document.getElementById("probeBtnA"),
      'B': document.getElementById("probeBtnB"),
      'C': document.getElementById("probeBtnC"),
      'D': document.getElementById("probeBtnD"),
      'E': document.getElementById("probeBtnE")
    };

    const probeToBadgeMap = {
      'A': document.getElementById("badge1"),
      'B': document.getElementById("badge3"),
      'C': document.getElementById("badge2"),
      'D': document.getElementById("badge4"),
      'E': document.getElementById("badge6")
    };

    function updateCursorState() {
      document.body.classList.remove(
        "custom-cursor",
        "cursor-probe-a",
        "cursor-probe-b",
        "cursor-probe-c",
        "cursor-probe-d",
        "cursor-probe-e"
      );

      if (isMultimeterActive) {
        if (selectedProbe) {
          document.body.classList.add(`cursor-probe-${selectedProbe.toLowerCase()}`);
        } else {
          document.body.classList.add("custom-cursor");
        }
      }
    }

    multimeterBtn.addEventListener("click", (e) => {
      e.preventDefault();
      isMultimeterActive = !isMultimeterActive;
      if (!isMultimeterActive) selectedProbe = null;
      updateCursorState();
    });

    Object.keys(probeBtns).forEach(probeKey => {
      probeBtns[probeKey].addEventListener("click", (e) => {
        e.preventDefault();
        isMultimeterActive = true;
        selectedProbe = probeKey;
        updateCursorState();
      });
    });

    document.querySelectorAll(".purple-region").forEach(region => {
      region.addEventListener("click", () => {
        if (isMultimeterActive) {
          const regionNum = region.getAttribute("data-region");
          const targetBadge = selectedProbe ? probeToBadgeMap[selectedProbe] : document.getElementById("badge1");
          
          if (targetBadge) {
            targetBadge.textContent = regionNum;
            targetBadge.style.display = "block";
          }
        }
      });
    });
  </script>

  <!-- OSCILLOSCOPE ANIMATION -->
  <script>
    const canvasElements = [
      document.getElementById("canvas1"),
      document.getElementById("canvas2"),
      document.getElementById("canvas3"),
      document.getElementById("canvas4"),
      document.getElementById("canvas5"),
      document.getElementById("canvas6")
    ];

    const ctxs = canvasElements.map(canvas => canvas.getContext("2d"));
    let time = 0;

    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const targetWidth = Math.round(width * dpr);
      const targetHeight = Math.round(height * dpr);

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { width, height };
    }

    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = "#17212d";
      ctx.lineWidth = 1;
      const stepX = width / 8;
      const stepY = height / 4;

      ctx.beginPath();
      for (let x = 0; x <= width; x += stepX) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let y = 0; y <= height; y += stepY) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();
    }

    function animate() {
      time += 0.04;
      ctxs.forEach((ctx, index) => {
        const canvas = ctx.canvas;
        const { width, height } = resizeCanvas(canvas);
        const centerY = height / 2;

        ctx.fillStyle = "rgba(5, 7, 10, 0.40)";
        ctx.fillRect(0, 0, width, height);
        drawGrid(ctx, width, height);

        ctx.lineWidth = 1.6;
        ctx.beginPath();

        for (let x = 0; x < width; x++) {
          const t = (x / width) * 4 * Math.PI + time;
          const s1 = Math.sin(t) * (height * 0.30);
          const s2 = (Math.sin(t * 2) > 0 ? 1 : -1) * (height * 0.25);
          const s3 = (Math.asin(Math.sin(t)) * (2 / Math.PI)) * (height * 0.30);
          const s4 = Math.sin(t * 4 + Math.cos(t)) * (height * 0.22);
          const s6 = Math.sin(t * 0.5) * Math.cos(t * 3) * (height * 0.28);

          let yVal;
          if (index === 0) { yVal = s1; ctx.strokeStyle = "#00ffcc"; }
          else if (index === 1) { yVal = s2; ctx.strokeStyle = "#ff3366"; }
          else if (index === 2) { yVal = s3; ctx.strokeStyle = "#00ffaa"; }
          else if (index === 3) { yVal = s4; ctx.strokeStyle = "#33ccff"; }
          else if (index === 4) {
            yVal = 0;
            if (document.getElementById("mix1").checked) {
              let op = document.getElementById("op1").value;
              yVal += (op === 'sub' ? -1 : 1) * (s1 * 0.5);
            }
            if (document.getElementById("mix2").checked) {
              let op = document.getElementById("op2").value;
              yVal += (op === 'sub' ? -1 : 1) * (s2 * 0.5);
            }
            if (document.getElementById("mix3").checked) {
              let op = document.getElementById("op3").value;
              yVal += (op === 'sub' ? -1 : 1) * (s3 * 0.5);
            }
            if (document.getElementById("mix4").checked) {
              let op = document.getElementById("op4").value;
              yVal += (op === 'sub' ? -1 : 1) * (s4 * 0.5);
            }
            if (document.getElementById("mix5").checked) {
              let op = document.getElementById("op5").value;
              let ch5SubVal = 0;
              if (document.getElementById("mix1").checked) ch5SubVal += (document.getElementById("op1").value === 'sub' ? -1 : 1) * (s1 * 0.5);
              if (document.getElementById("mix2").checked) ch5SubVal += (document.getElementById("op2").value === 'sub' ? -1 : 1) * (s2 * 0.5);
              if (document.getElementById("mix3").checked) ch5SubVal += (document.getElementById("op3").value === 'sub' ? -1 : 1) * (s3 * 0.5);
              if (document.getElementById("mix4").checked) ch5SubVal += (document.getElementById("op4").value === 'sub' ? -1 : 1) * (s4 * 0.5);
              yVal += (op === 'sub' ? -1 : 1) * ch5SubVal;
            }
            ctx.strokeStyle = "#ffcc00";
          } else if (index === 5) { yVal = s6; ctx.strokeStyle = "#ff66cc"; }

          const drawY = centerY - yVal;
          if (x === 0) ctx.moveTo(x, drawY);
          else ctx.lineTo(x, drawY);
        }
        ctx.stroke();
      });
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
