<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>My test page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    
    <style>
      /* Lock html/body and allow full 2D scrolling (up, down, left, right) over the background */
      html, body {
        margin: 0;
        padding: 0;
        color: #fff;
        font-family: monospace;

        /* Allow scrolling in all directions */
        overflow: auto;
        min-height: 100vh;
        min-width: 100vw;

        /* Background image setup for full panning/scrolling */
        background-image: url('images/chip_background_gui.png');
        background-size: auto; /* Keeps the original image size so you can scroll to see all of it if it's large */
        background-repeat: no-repeat;
        background-position: top left;
      }

      .page-layout {
        display: flex;
        flex-direction: column;

        /* Minimum dimensions ensuring the background image area is large enough to scroll */
        min-width: 1400px;
        min-height: 900px;

        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }

      /* Top section containing your content and background waves */
      .top-section {
        flex: 1; /* Takes up remaining space above the scopes */
        padding: 20px;
        box-sizing: border-box;
        position: relative;
      }

      /* Bottom section: 5 Oscilloscopes in 2 Columns + Calculator, pinned at the bottom */
      .bottom-section {
        height: 280px; /* Fixed or flexible height for the bottom control deck */
        background: rgba(6, 9, 15, 0.92);
        border-top: 2px solid #1a2634;
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 Columns */
        grid-template-rows: repeat(3, 1fr);
        gap: 6px;
        padding: 6px;
        box-sizing: border-box;
      }

      /* Oscilloscope panel styling */
      .scope-panel {
        background: rgba(5, 7, 10, 0.85);
        backdrop-filter: blur(3px);
        border: 1px solid rgba(0, 255, 136, 0.3);
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .scope-header {
        font-size: 10px;
        color: #00ff88;
        padding: 2px 6px;
        background: rgba(0, 255, 136, 0.05);
        border-bottom: 1px solid #1e293b;
        display: flex;
        justify-content: space-between;
      }

      canvas {
        width: 100%;
        flex: 1;
        display: block;
      }

      /* Calculator panel spanning the right bottom cell */
      .calc-panel {
        grid-column: 2;
        grid-row: 3;
        background: rgba(9, 13, 22, 0.9);
        backdrop-filter: blur(3px);
        border: 1px solid #00ff88;
        border-radius: 4px;
        padding: 4px 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        font-size: 11px;
        color: #00ff88;
      }

      .calc-panel label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
        cursor: pointer;
      }

      .hidden { display: none; }
    </style>
  </head>
  
  <body>
    <div class="page-layout">
      
      <!-- TOP SECTION -->
      <div class="top-section">
        <p>
          <a href="encrypt.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; color: #00ff88;">
            <img src="images/RTL_icon.png" alt="Verilog Icon" style="width: 24px; height: 24px; vertical-align: middle;">
            <span>View Verilog Code</span>
          </a>
        </p>

        <div id="loading" class="hidden">
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
        </div>

        <div id="wave-grid" class="hidden">
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
          <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        </div>
      </div>

      <!-- BOTTOM SECTION: 5 Oscilloscopes in 2 Columns + Calculator -->
      <div class="bottom-section">
        
        <!-- Plot 1 -->
        <div class="scope-panel" style="grid-column: 1; grid-row: 1;">
          <div class="scope-header"><span>CH 1: Sine Wave</span><span>1 kHz</span></div>
          <canvas id="canvas1"></canvas>
        </div>

        <!-- Plot 2 -->
        <div class="scope-panel" style="grid-column: 2; grid-row: 1;">
          <div class="scope-header"><span>CH 2: Square Wave</span><span>500 Hz</span></div>
          <canvas id="canvas2"></canvas>
        </div>

        <!-- Plot 3 -->
        <div class="scope-panel" style="grid-column: 1; grid-row: 2;">
          <div class="scope-header"><span>CH 3: Triangle Wave</span><span>250 Hz</span></div>
          <canvas id="canvas3"></canvas>
        </div>

        <!-- Plot 4 -->
        <div class="scope-panel" style="grid-column: 2; grid-row: 2;">
          <div class="scope-header"><span>CH 4: High-Freq Noise/Sine</span><span>2 kHz</span></div>
          <canvas id="canvas4"></canvas>
        </div>

        <!-- Plot 5 -->
        <div class="scope-panel" style="grid-column: 1; grid-row: 3;">
          <div class="scope-header"><span>CH 5: Superposition Output</span><span>MATH</span></div>
          <canvas id="canvas5"></canvas>
        </div>

        <!-- Calculator Panel -->
        <div class="calc-panel">
          <strong>🎛️ Superposition Mixer</strong>
          <div>
            <label><input type="checkbox" id="mix1" checked> CH1</label>
            <label><input type="checkbox" id="mix2" checked> CH2</label>
            <label><input type="checkbox" id="mix3"> CH3</label>
            <label><input type="checkbox" id="mix4"> CH4</label>
          </div>
        </div>

      </div>
    </div>

    <!-- Scripts -->
    <script>
      setTimeout(() => {
        document.getElementById("loading").classList.remove("hidden");
      }, 120000);
    </script>

    <script>
      let timerStarted = false;
      document.addEventListener("click", () => {
        if (timerStarted) return;
        timerStarted = true;
        setTimeout(() => {
          document.getElementById("wave-grid").classList.remove("hidden");
        }, 120000);
      });
    </script>

    <script>
      const ctxs = [
        document.getElementById('canvas1').getContext('2d'),
        document.getElementById('canvas2').getContext('2d'),
        document.getElementById('canvas3').getContext('2d'),
        document.getElementById('canvas4').getContext('2d'),
        document.getElementById('canvas5').getContext('2d')
      ];

      let time = 0;

      function drawGrid(ctx, width, height) {
        ctx.strokeStyle = '#101722';
        ctx.lineWidth = 1;
        const stepX = width / 8;
        const stepY = height / 4;
        ctx.beginPath();
        for (let x = 0; x <= width; x += stepX) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
        for (let y = 0; y <= height; y += stepY) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
        ctx.stroke();
      }

      function animate() {
        time += 0.04;
        
        ctxs.forEach((ctx, index) => {
          const canvas = ctx.canvas;
          const width = canvas.width = canvas.clientWidth || 300;
          const height = canvas.height = canvas.clientHeight || 150;
          const centerY = height / 2;

          ctx.fillStyle = 'rgba(5, 7, 10, 0.35)';
          ctx.fillRect(0, 0, width, height);
          drawGrid(ctx, width, height);

          ctx.lineWidth = 2;
          ctx.beginPath();

          for (let x = 0; x < width; x++) {
            let t = (x / width) * 4 * Math.PI + time;
            let yVal = 0;

            let s1 = Math.sin(t) * (height * 0.35);
            let s2 = (Math.sin(t * 2) > 0 ? 1 : -1) * (height * 0.3);
            let s3 = (Math.asin(Math.sin(t)) * (2 / Math.PI)) * (height * 0.35);
            let s4 = Math.sin(t * 4 + Math.cos(t)) * (height * 0.25);

            if (index === 0) {
              yVal = s1; ctx.strokeStyle = '#00ffcc';
            } else if (index === 1) {
              yVal = s2; ctx.strokeStyle = '#ff3366';
            } else if (index === 2) {
              yVal = s3; ctx.strokeStyle = '#00ffaa';
            } else if (index === 3) {
              yVal = s4; ctx.strokeStyle = '#33ccff';
            } else if (index === 4) {
              yVal = 0;
              if (document.getElementById('mix1').checked) yVal += s1 * 0.5;
              if (document.getElementById('mix2').checked) yVal += s2 * 0.5;
              if (document.getElementById('mix3').checked) yVal += s3 * 0.5;
              if (document.getElementById('mix4').checked) yVal += s4 * 0.5;
              ctx.strokeStyle = '#ffcc00';
            }

            let drawY = centerY - yVal;
            if (x === 0) ctx.moveTo(x, drawY);
            else ctx.lineTo(x, drawY);
          }
          ctx.stroke();
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
