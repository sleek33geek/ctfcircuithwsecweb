<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>My test page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
   

<p>
  <a href="encrypt.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
  <img src="images/RTL_icon.png" alt="Verilog Icon" style="width: 24px; height: 24px; vertical-align: middle;">
    <span>View Verilog Code</span>
      </a>
    </p>
  

    <div id="loading" class="hidden">
    <span class="wave"></span>
    <span class="wave"></span>
    <span class="wave"></span>
    </div>
  
    <script>
    setTimeout(() => {
      document.getElementById("loading").classList.remove("hidden");
    }, 120000); // 2 minutes
  </script>

    <div id="wave-grid" class="hidden">
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
      <div class="wave-cell"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
    </div>

    <script>
      let timerStarted = false;
    
      document.addEventListener("click", () => {
        if (timerStarted) return;
    
        timerStarted = true;
    
        setTimeout(() => {
          document.getElementById("wave-grid").classList.remove("hidden");
        }, 120000);
      });
    </script>
        
  </body>
</html>
