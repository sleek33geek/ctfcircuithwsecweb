<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Schematic Block Diagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* Ensures the background doesn't create unexpected scrollbars */
        overflow: hidden; 
      }

      body {
        /* Points to your root images/ folder */
        background-image: url('images/schematic.drawio.png'); 
        /* Centers the image perfectly */
        background-position: center center; 
        /* Prevents the image from repeating like a tile */
        background-repeat: no-repeat; 
        /* Scales the image dynamically to cover the whole screen */
        background-size: contain; 
        /* Optional fallback color in case the image fails to load */
        background-color: #ffffff; 
      }
    </style>
  </head>
  <body>
    <!-- The page is left completely empty as requested to show only the background -->
  </body>
</html>
